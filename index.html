<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://image.pollinations.ai https://pixabay.com https://www.pexels.com https://www.videvo.net; media-src 'self' https://pixabay.com https://www.pexels.com https://www.videvo.net; connect-src 'self' https://image.pollinations.ai https://pixabay.com https://www.pexels.com https://www.videvo.net;">
<title>AI Image & Video Generator — Free</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#020817;font-family:'Syne',sans-serif;color:#e2e8f0;min-height:100vh}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinR{to{transform:rotate(-360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(rgba(56,189,248,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,0.03) 1px,transparent 1px);
    background-size:50px 50px}
  .glow{position:fixed;border-radius:50%;filter:blur(120px);opacity:.12;pointer-events:none;z-index:0}
  .g1{width:600px;height:600px;top:-200px;left:-100px;background:radial-gradient(circle,#0ea5e9,transparent)}
  .g2{width:500px;height:500px;bottom:-100px;right:-100px;background:radial-gradient(circle,#6366f1,transparent)}
  .wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 16px 60px}
  header{text-align:center;padding:50px 16px 32px}
  .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(14,165,233,0.1);border:1px solid rgba(14,165,233,0.25);color:#38bdf8;font-size:11px;font-family:'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;padding:5px 14px;border-radius:100px;margin-bottom:20px}
  .badge::before{content:'●';font-size:8px;animation:pulse 2s infinite}
  h1{font-size:clamp(30px,7vw,64px);font-weight:800;line-height:1;letter-spacing:-.03em;margin-bottom:14px;background:linear-gradient(135deg,#f8fafc,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .hl{background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .sub{color:#64748b;font-size:14px;font-family:'DM Mono',monospace;margin-bottom:28px}
  .pills{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:40px}
  .pill{background:rgba(15,23,42,.7);border:1px solid rgba(51,65,85,.4);border-radius:100px;padding:5px 14px;font-size:11px;color:#64748b;font-family:'DM Mono',monospace}
  .pill b{color:#38bdf8;font-weight:400}
  .tabs{display:flex;background:rgba(15,23,42,.8);border:1px solid rgba(51,65,85,.5);border-radius:12px;padding:4px;width:fit-content;margin:0 auto 32px}
  .tab{padding:10px 24px;border:none;cursor:pointer;font-family:'Syne',sans-serif;font-weight:600;font-size:13px;border-radius:9px;transition:all .2s}
  .tab.on{background:linear-gradient(135deg,#0ea5e9,#6366f1);color:white;box-shadow:0 4px 20px rgba(14,165,233,.3)}
  .tab.off{background:transparent;color:#64748b}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  @media(max-width:700px){.grid{grid-template-columns:1fr}}
  .panel{background:rgba(15,23,42,.7);border:1px solid rgba(51,65,85,.5);border-radius:20px;padding:24px;backdrop-filter:blur(20px)}
  .plabel{font-size:11px;color:#475569;font-family:'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
  textarea{width:100%;background:rgba(2,8,23,.6);border:1px solid rgba(51,65,85,.5);border-radius:12px;color:#e2e8f0;font-family:'DM Mono',monospace;font-size:13px;padding:14px;resize:none;outline:none;line-height:1.6;min-height:110px;transition:border-color .2s}
  textarea:focus{border-color:rgba(14,165,233,.5)}
  textarea::placeholder{color:#334155}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
  .chip{padding:5px 13px;border-radius:100px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid;font-family:'Syne',sans-serif}
  .chip.on{background:rgba(14,165,233,.15);border-color:rgba(14,165,233,.5);color:#38bdf8}
  .chip.off{background:transparent;border-color:rgba(51,65,85,.5);color:#475569}
  .dims{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  select{width:100%;background:rgba(2,8,23,.6);border:1px solid rgba(51,65,85,.5);color:#94a3b8;font-family:'DM Mono',monospace;font-size:12px;padding:8px 10px;border-radius:8px;outline:none;cursor:pointer}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid rgba(51,65,85,.3);margin-top:10px}
  .tl{font-size:12px;color:#64748b}
  .tog{width:38px;height:20px;border-radius:100px;position:relative;cursor:pointer;transition:background .2s;border:none}
  .tog-knob{position:absolute;width:14px;height:14px;border-radius:50%;background:white;top:3px;transition:left .2s}
  .gbtn{width:100%;padding:15px;background:linear-gradient(135deg,#0ea5e9,#6366f1);border:none;border-radius:12px;color:white;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;letter-spacing:.05em;cursor:pointer;transition:all .2s;margin-top:16px}
  .gbtn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 30px rgba(14,165,233,.4)}
  .gbtn:disabled{opacity:.5;cursor:not-allowed}
  .err{margin-top:10px;padding:10px 14px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;font-size:12px;color:#f87171;font-family:'DM Mono',monospace}
  .hint{font-size:10px;color:#334155;font-family:'DM Mono',monospace;text-align:center;margin-top:8px}
  .rbox{background:rgba(15,23,42,.7);border:1px solid rgba(51,65,85,.5);border-radius:20px;overflow:hidden;backdrop-filter:blur(20px);min-height:460px;display:flex;align-items:center;justify-content:center}
  .empty{text-align:center;padding:50px 30px}
  .eicon{width:72px;height:72px;background:rgba(51,65,85,.2);border:1px solid rgba(51,65,85,.3);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px}
  .etitle{font-size:16px;font-weight:700;color:#475569;margin-bottom:6px}
  .esub{font-size:12px;color:#334155;font-family:'DM Mono',monospace}
  .orb-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
  .orb{position:relative;width:72px;height:72px}
  .ring{position:absolute;border-radius:50%;border:2px solid transparent}
  .r1{inset:0;border-top-color:#38bdf8;border-right-color:#38bdf8;animation:spin 1.2s linear infinite}
  .r2{inset:10px;border-bottom-color:#818cf8;border-left-color:#818cf8;animation:spinR 1.8s linear infinite}
  .core{position:absolute;inset:26px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.4),rgba(99,102,241,.1));animation:pulse 1.5s infinite}
  .gtext{color:#94a3b8;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-family:'DM Mono',monospace}
  .img-res img{width:100%;display:block;border-radius:20px 20px 0 0;animation:fadeIn .5s ease}
  .acts{padding:14px 18px;display:flex;gap:10px;background:rgba(2,8,23,.6);border-top:1px solid rgba(51,65,85,.3)}
  .abtn{flex:1;padding:9px;font-family:'Syne',sans-serif;font-weight:600;font-size:12px;border-radius:8px;cursor:pointer;transition:opacity .15s}
  .abtn.p{background:linear-gradient(135deg,#0ea5e9,#6366f1);border:none;color:white}
  .abtn.s{background:rgba(51,65,85,.3);border:1px solid rgba(51,65,85,.5);color:#94a3b8}
  .abtn:hover{opacity:.85}
  .vres{padding:28px;width:100%;animation:fadeIn .5s ease}
  .vtitle{font-size:15px;font-weight:700;margin-bottom:5px}
  .vstyle{font-size:11px;color:#38bdf8;font-family:'DM Mono',monospace;margin-bottom:16px}
  .vlinks{display:flex;flex-direction:column;gap:9px}
  .vlink{display:flex;align-items:center;gap:10px;padding:13px 15px;background:rgba(14,165,233,.05);border:1px solid rgba(14,165,233,.15);border-radius:10px;text-decoration:none;color:#e2e8f0;font-size:13px;font-weight:600;transition:all .15s}
  .vlink:hover{background:rgba(14,165,233,.1);border-color:rgba(14,165,233,.3)}
  .varr{margin-left:auto;color:#38bdf8}
  .vnote{margin-top:16px;padding:11px 14px;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);border-radius:8px;font-size:11px;color:#818cf8;font-family:'DM Mono',monospace;line-height:1.6}
  .hist{margin-top:16px}
  .hgrid{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px}
  .hitem{flex-shrink:0;width:72px;cursor:pointer;border-radius:8px;overflow:hidden;border:1px solid rgba(51,65,85,.3);transition:all .15s}
  .hitem:hover{border-color:rgba(14,165,233,.4);transform:translateY(-2px)}
  .hitem img{width:72px;height:54px;object-fit:cover;display:block}
  .vnote2{margin-top:14px;padding:11px 14px;background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.15);border-radius:10px;font-size:12px;color:#818cf8;font-family:'DM Mono',monospace;line-height:1.6}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="glow g1"></div>
<div class="glow g2"></div>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const IMG_STYLES = ["Photorealistic","Cinematic","Portrait","Landscape","Macro","Street Photography","Documentary","Architecture"];
const VID_STYLES = ["Cinematic","Timelapse","Slow Motion","Documentary","Aerial","News Style","Nature","Urban"];

function App() {
  const [tab, setTab] = useState("Image");
  const [prompt, setPrompt] = useState("");
  const [style, setStyle] = useState("Photorealistic");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState("");
  const [history, setHistory] = useState([]);
  const [width, setWidth] = useState(1024);
  const [height, setHeight] = useState(768);
  const [enhance, setEnhance] = useState(true);
  const [vPrompt, setVPrompt] = useState("");
  const [vStyle, setVStyle] = useState("Cinematic");

  const genImage = async () => {
    if (!prompt.trim()) return;
    setLoading(true); setError(""); setResult(null);
    const seed = Math.floor(Math.random() * 99999);
    try {
      const fp = enhance
        ? `${prompt}, ${style.toLowerCase()} photography, ultra realistic, high resolution, professional photo, 8k`
        : `${prompt}, ${style.toLowerCase()}`;
      const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(fp)}?width=${width}&height=${height}&seed=${seed}&nologo=true&enhance=true`;
      const img = new Image();
      img.crossOrigin = "anonymous";
      await new Promise((res, rej) => {
        img.onload = res; img.onerror = rej; img.src = url;
        setTimeout(rej, 35000);
      });
      setResult({ type: "image", url, prompt, style });
      setHistory(h => [{ url, prompt: prompt.slice(0,35) }, ...h.slice(0,7)]);
    } catch {
      setError("Generation failed. Please rephrase your prompt and try again.");
    } finally { setLoading(false); }
  };

  const genVideo = async () => {
    if (!vPrompt.trim()) return;
    setLoading(true); setError(""); setResult(null);
    await new Promise(r => setTimeout(r, 1200));
    setResult({
      type: "video", prompt: vPrompt, style: vStyle,
      links: [
        { name: "🎬 Pixabay Free Videos", url: `https://pixabay.com/videos/search/?q=${encodeURIComponent(vPrompt)}` },
        { name: "🎥 Pexels Free Videos", url: `https://www.pexels.com/search/videos/${encodeURIComponent(vPrompt)}/` },
        { name: "📽 Videvo Free Footage", url: `https://www.videvo.net/search/${encodeURIComponent(vPrompt)}/` },
      ]
    });
    setLoading(false);
  };

  const go = () => tab === "Image" ? genImage() : genVideo();

  return (
    <div className="wrap">
      <header>
        <div className="badge">100% Free · No Login Required</div>
        <h1>Create <span className="hl">Real AI</span><br/>Images & Videos</h1>
        <p className="sub">Professional-grade generation — free forever</p>
        <div className="pills">
          {["✓ Photorealistic","✓ Free Forever","✓ HD Quality","✓ Instant"].map(t => (
            <div className="pill" key={t}><b>{t.split(" ")[0]}</b> {t.split(" ").slice(1).join(" ")}</div>
          ))}
        </div>
      </header>

      <div className="tabs">
        <button className={`tab ${tab==="Image"?"on":"off"}`} onClick={() => { setTab("Image"); setResult(null); setError(""); }}>🖼 Image Generator</button>
        <button className={`tab ${tab==="Video"?"on":"off"}`} onClick={() => { setTab("Video"); setResult(null); setError(""); }}>🎬 Video Generator</button>
      </div>

      <div className="grid">
        <div>
          <div className="panel">
            <div className="plabel">{tab === "Image" ? "Describe your image" : "Describe your video"}</div>
            <textarea
              placeholder={tab === "Image"
                ? "A beautiful sunset over mountains, golden hour, cinematic..."
                : "Aerial view of Mumbai at night, city lights, slow pan..."}
              value={tab === "Image" ? prompt : vPrompt}
              onChange={e => tab === "Image" ? setPrompt(e.target.value) : setVPrompt(e.target.value)}
              onKeyDown={e => { if (e.ctrlKey && e.key === "Enter") go(); }}
            />

            <div className="plabel" style={{marginTop:16}}>{tab === "Image" ? "Photography Style" : "Video Style"}</div>
            <div className="chips">
              {(tab === "Image" ? IMG_STYLES : VID_STYLES).map(s => (
                <button key={s}
                  className={`chip ${(tab==="Image"?style:vStyle)===s?"on":"off"}`}
                  onClick={() => tab==="Image" ? setStyle(s) : setVStyle(s)}>{s}</button>
              ))}
            </div>

            {tab === "Image" && (<>
              <div className="dims">
                <div>
                  <div className="plabel">Width</div>
                  <select value={width} onChange={e => setWidth(Number(e.target.value))}>
                    {[512,768,1024,1280].map(v => <option key={v} value={v}>{v}px</option>)}
                  </select>
                </div>
                <div>
                  <div className="plabel">Height</div>
                  <select value={height} onChange={e => setHeight(Number(e.target.value))}>
                    {[512,768,1024,1280].map(v => <option key={v} value={v}>{v}px</option>)}
                  </select>
                </div>
              </div>
              <div className="toggle-row">
                <span className="tl">AI Enhancement (more realistic)</span>
                <button className="tog" style={{background: enhance ? "linear-gradient(135deg,#0ea5e9,#6366f1)" : "rgba(51,65,85,.5)"}}
                  onClick={() => setEnhance(e => !e)}>
                  <div className="tog-knob" style={{left: enhance ? 21 : 3}} />
                </button>
              </div>
            </>)}

            {tab === "Video" && (
              <div className="vnote2">💡 Video generator finds free professional stock footage matching your description from top free sites.</div>
            )}

            <button className="gbtn" onClick={go}
              disabled={loading || (tab==="Image" ? !prompt.trim() : !vPrompt.trim())}>
              {loading ? "⟳ Generating..." : tab==="Image" ? "✦ Generate Real Image" : "✦ Find Free Video"}
            </button>
            {error && <div className="err">⚠ {error}</div>}
            <p className="hint">Ctrl+Enter to generate</p>
          </div>

          {history.length > 0 && (
            <div className="panel hist" style={{marginTop:14}}>
              <div className="plabel">Recent Images</div>
              <div className="hgrid">
                {history.map((h, i) => (
                  <div key={i} className="hitem" onClick={() => setResult({type:"image", url:h.url, prompt:h.prompt})} title={h.prompt}>
                    <img src={h.url} alt="" />
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>

        <div className="rbox" style={{display:"block"}}>
          {!result && !loading && (
            <div className="empty">
              <div className="eicon">{tab==="Image" ? "🖼" : "🎬"}</div>
              <div className="etitle">Your {tab.toLowerCase()} appears here</div>
              <div className="esub">Write a prompt and click generate</div>
            </div>
          )}

          {loading && (
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:460}}>
              <div className="orb-wrap">
                <div className="orb">
                  <div className="ring r1" />
                  <div className="ring r2" />
                  <div className="core" />
                </div>
                <p className="gtext">Generating...</p>
              </div>
            </div>
          )}

          {!loading && result?.type === "image" && (
            <div className="img-res">
              <img src={result.url} alt={result.prompt} />
              <div className="acts">
                <button className="abtn p" onClick={() => window.open(result.url, "_blank")}>↓ Download HD</button>
                <button className="abtn s" onClick={() => { setResult(null); genImage(); }}>↻ Regenerate</button>
                <button className="abtn s" onClick={() => window.open(result.url, "_blank")}>⤢ Full Size</button>
              </div>
            </div>
          )}

          {!loading && result?.type === "video" && (
            <div className="vres">
              <div className="vtitle">{result.prompt}</div>
              <div className="vstyle">Style: {result.style}</div>
              <div className="plabel">Free Video Sources</div>
              <div className="vlinks">
                {result.links.map((l, i) => (
                  <a key={i} href={l.url} target="_blank" rel="noopener noreferrer" className="vlink">
                    {l.name}<span className="varr">→</span>
                  </a>
                ))}
              </div>
              <div className="vnote">💡 All sources provide 100% free, royalty-free professional video footage.</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
